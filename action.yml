---
name: kubara-action
description: Install a verified kubara release and run the CLI
inputs:
  version:
    description: Release version (for example v0.18.0) or latest
    default: latest
  args:
    description: CLI arguments as a JSON array of strings; use [] to install only
    default: '["generate"]'
  working-directory:
    description: Directory in which to run kubara
    default: '.'
runs:
  using: composite
  steps:
    - name: Install kubara
      shell: bash
      env:
        KUBARA_VERSION: ${{ inputs.version }}
        KUBARA_INSTALL_DIR: ${{ runner.temp }}/kubara-bin
      run: |
        curl -fsSL https://raw.githubusercontent.com/kubara-io/kubara/main/install.sh -o "${{ runner.temp }}/install-kubara.sh"
        sh "${{ runner.temp }}/install-kubara.sh"
        echo "$KUBARA_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Run kubara
      shell: bash
      env:
        KUBARA_ARGS: ${{ inputs.args }}
        KUBARA_WORK_DIR: ${{ inputs.working-directory }}
      run: |-
        # Validate that inputs.args is a valid JSON array of strings without NUL bytes
        if ! jq -e 'type == "array" and all(.[]; type == "string" and (contains("\u0000") | not))' <<< "$KUBARA_ARGS" > /dev/null 2>&1; then
          echo "Error: inputs.args must be a valid JSON array of strings (for example '[\"generate\"]'). Received: $KUBARA_ARGS" >&2
          exit 1
        fi

        # Safely deserialize JSON string array into a bash array using NUL delimiters to preserve whitespace and special characters
        args=()
        while IFS= read -r -d '' arg; do
          args+=("$arg")
        done < <(jq -j '.[] | ., "\u0000"' <<< "$KUBARA_ARGS")
        if [ "${#args[@]}" -gt 0 ]; then
          cd "$KUBARA_WORK_DIR"
          kubara "${args[@]}"
        fi
