name: Test Action

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installation and version execution
        uses: ./
        with:
          args: '["--version"]'

      - name: Test install-only mode
        uses: ./
        with:
          args: '[]'

      - name: Verify CLI is in PATH
        run: kubara --version
